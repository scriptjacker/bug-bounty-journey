* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

/* ===== HEADER ===== */
.header {
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--border);

    backdrop-filter: blur(12px);
    z-index: 100;
}

.header-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-name {
    font-size: 1.1rem;
    font-weight: 700;
}

.header-name span {
    color: var(--accent);
    font-family: var(--font-mono);

}

.header-nav {

}

.header-nav a {

    font-size: 0.9rem;

    transition: color 0.2s;
}

.header-nav a:hover {
    color: var(--text);

}

/* ===== HERO ===== */
.hero {
    padding: 4rem 0 3rem;

}

.hero h1 {

    margin-bottom: 0.75rem;
}

.hero p {
    color: var(--text-dim);
    font-size: 1.1rem;
    max-width: 600px;
    margin: 0 auto;
}

/* ===== CATEGORY TABS ===== */
.cat-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
}

.cat-tab {
    padding: 0.6rem 1.2rem;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.cat-tab:hover { color: var(--text-dim); }

.cat-tab.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: rgba(56,189,248,0.15);
}

.cat-count {
    font-size: 0.75rem;
    font-family: var(--font-mono);
    background: var(--bg-elevated);
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
}

/* ===== SEARCH ===== */
.gallery-search {
    width: 100%;
    max-width: 400px;
    padding: 0.8rem 1rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-card);
    color: var(--text);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
    outline: none;
}

.gallery-search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
}

.gallery-count {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-bottom: 1.5rem;
}

/* ===== GALLERY GRID ===== */
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
}

.gallery-item {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.2s;
}

.gallery-item:hover {
    border-color: var(--border-light);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.gallery-thumb {
    width: 100%;
    aspect-ratio: 16/10;
    background: var(--bg-elevated);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.gallery-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
}

.gallery-item:hover .gallery-thumb img {
    transform: scale(1.03);
}

.gallery-placeholder {
    color: var(--text-muted);
    font-size: 2.5rem;
}

.gallery-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s;
}

.gallery-item:hover .gallery-overlay {
    opacity: 1;
}

.gallery-overlay span {
    color: white;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.gallery-info {
    padding: 1rem 1.25rem;
}

.gallery-domain {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--accent);
    margin-bottom: 0.2rem;
}

.gallery-title {
    font-weight: 600;
    font-size: 0.9rem;
    line-height: 1.3;
    margin-bottom: 0.3rem;
}

.gallery-meta {
    font-size: 0.75rem;
    color: var(--text-muted);
}

.gallery-tag {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    margin-top: 0.5rem;
}

.tag-hof { background: var(--accent-soft); color: var(--accent); }
.tag-cert { background: var(--green-soft); color: var(--green); }
.tag-letter { background: var(--purple-soft); color: var(--purple); }
.tag-swag { background: var(--gold-soft); color: var(--gold); }

/* ===== LIGHTBOX ===== */
.lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem;

.lightbox.active {
    display: flex;

.lightbox-img {

    max-height: 85vh;
    border-radius: var(--radius-sm);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);

.lightbox-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 2rem;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));

.lightbox-title {

.lightbox-domain {

    color: var(--accent);

.lightbox-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 1.5rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
}

.lightbox-close:hover {
    background: rgba(255,255,255,0.2);
}

.lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.1);
    border: none;
    color: white;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;

.lightbox-nav:hover { background: rgba(255,255,255,0.2); }
.lightbox-prev { left: 1.5rem; }
.lightbox-next { right: 1.5rem; }

/* ===== FOOTER ===== */

    .gallery-info { padding: 0.75rem; }
    .lightbox-nav { display: none; }

@media (max-width: 480px) {

// Category labels
const CAT_LABELS = {
    hof: "Hall of Fame",
    cert: "Certificate",
    letter: "Letter",
    swag: "Swag"
};

const CAT_CLASSES = {
    hof: "tag-hof",
    cert: "tag-cert",
    letter: "tag-letter",
    swag: "tag-swag"
};

let currentCat = "all";
let searchQuery = "";
let filteredItems = [];
let lightboxIndex = 0;

function updateCounts() {
    document.getElementById("count-all").textContent = GALLERY_ITEMS.length;
    document.getElementById("count-hof").textContent = GALLERY_ITEMS.filter(i => i.category === "hof").length;
    document.getElementById("count-cert").textContent = GALLERY_ITEMS.filter(i => i.category === "cert").length;
    document.getElementById("count-letter").textContent = GALLERY_ITEMS.filter(i => i.category === "letter").length;
    document.getElementById("count-swag").textContent = GALLERY_ITEMS.filter(i => i.category === "swag").length;
}

function renderGallery() {
    filteredItems = GALLERY_ITEMS.filter(item => {
        if (currentCat !== "all" && item.category !== currentCat) return false;
        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return (item.domain && item.domain.toLowerCase().includes(q)) ||
                   (item.title && item.title.toLowerCase().includes(q));
        }
        return true;
    });

    document.getElementById("galleryCount").textContent = 
        "Showing " + filteredItems.length + " of " + GALLERY_ITEMS.length + " items";

    const grid = document.getElementById("galleryGrid");

    if (filteredItems.length === 0) {
        grid.innerHTML = `
            <div style="grid-column:1/-1; text-align:center; padding:4rem; color:var(--text-muted);">
                <div style="font-size:3rem; margin-bottom:1rem;">📂</div>
                <p>No items yet. Add your photos to the GALLERY_ITEMS array in the HTML file.</p>
                <p style="margin-top:0.5rem; font-size:0.85rem;">See the commented examples in the script section.</p>
            </div>
        `;
        return;
    }

    grid.innerHTML = filteredItems.map((item, index) => `
        <div class="gallery-item" onclick="openLightbox(${index})">
            <div class="gallery-thumb">
                ${item.image ? 
                    `<img src="${item.thumb || item.image}" alt="${item.title}" loading="lazy">` :
                    `<div class="gallery-placeholder">📷</div>`
                }
                <div class="gallery-overlay"><span>Click to view</span></div>
            </div>
            <div class="gallery-info">
                <div class="gallery-domain">${item.domain}</div>
                <div class="gallery-title">${item.title}</div>
                <div class="gallery-meta">
                    ${item.date ? new Date(item.date).toLocaleDateString("en-US", {year:"numeric", month:"short"}) : ""}
                </div>
                <span class="gallery-tag ${CAT_CLASSES[item.category] || "tag-hof"}">${CAT_LABELS[item.category] || item.category}</span>
                ${item.hofUrl ? `<div style="margin-top:0.5rem;"><a href="${item.hofUrl}" target="_blank" onclick="event.stopPropagation()" style="font-size:0.75rem;">View Hall of Fame page &rarr;</a></div>` : ""}
            </div>
        </div>
    `).join("");
}

// Tab clicks
document.querySelectorAll(".cat-tab").forEach(tab => {
    tab.addEventListener("click", () => {
        document.querySelectorAll(".cat-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentCat = tab.dataset.cat;
        renderGallery();
    });
});

// Search
document.getElementById("gallerySearch").addEventListener("input", e => {
    searchQuery = e.target.value;
    renderGallery();
});

// Lightbox
function openLightbox(index) {
    lightboxIndex = index;
    const item = filteredItems[index];
    document.getElementById("lightboxImg").src = item.image || "";
    document.getElementById("lightboxTitle").textContent = item.title;
    document.getElementById("lightboxDomain").textContent = item.domain;
    document.getElementById("lightbox").classList.add("active");
    document.body.style.overflow = "hidden";
}

function closeLightbox(e) {
    if (e && e.target !== e.currentTarget && !e.target.classList.contains("lightbox-close")) return;
    document.getElementById("lightbox").classList.remove("active");
    document.body.style.overflow = "";
}

function navLightbox(dir) {
    lightboxIndex += dir;
    if (lightboxIndex < 0) lightboxIndex = filteredItems.length - 1;
    if (lightboxIndex >= filteredItems.length) lightboxIndex = 0;
    const item = filteredItems[lightboxIndex];
    document.getElementById("lightboxImg").src = item.image || "";
    document.getElementById("lightboxTitle").textContent = item.title;
    document.getElementById("lightboxDomain").textContent = item.domain;
}

// Keyboard
document.addEventListener("keydown", e => {
    if (!document.getElementById("lightbox").classList.contains("active")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") navLightbox(-1);
    if (e.key === "ArrowRight") navLightbox(1);
});

// Init
updateCounts();
renderGallery();
</script>
