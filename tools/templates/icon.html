<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: "GM"; src: url("/assets/fonts/geist-mono.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: transparent; }
  .tile { width: 512px; height: 512px; border-radius: 112px; background: #0f1215; display: grid; place-items: center; position: relative; overflow: hidden; }
  .tile.full { border-radius: 0; }
  .tile span { font-family: "GM", monospace; font-weight: 700; font-size: 230px; letter-spacing: -0.06em; color: #eceef1; transform: translateX(-6px); }
  .tile i { position: absolute; right: 92px; bottom: 112px; width: 44px; height: 44px; border-radius: 50%; background: #3fdc9a; }
</style></head>
<body><div class="tile"><span>PN</span><i></i></div></body></html>
