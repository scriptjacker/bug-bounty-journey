<!doctype html>
<html lang="en" data-theme="dark" class="js is-ready">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  html, body { width: 1200px; height: 630px; overflow: hidden; padding: 0; }
  body::after { opacity: 0.05; }
  .og { position: relative; width: 1200px; height: 630px; padding: 58px 64px; overflow: hidden; isolation: isolate; background: var(--bg); }
  .og .hero__wall { z-index: -2; }
  .og .hero__plane { left: 74%; width: 1500px; }
  .og .hero__col img { opacity: 1; }
  .og-shade { position: absolute; inset: 0; z-index: -1; background:
    linear-gradient(90deg, rgba(var(--bg-rgb), 0.97) 0%, rgba(var(--bg-rgb), 0.9) 46%, rgba(var(--bg-rgb), 0.35) 72%, rgba(var(--bg-rgb), 0.55) 100%); }
  .og .hero__status { font-size: 15px; }
  .og .hero__name { margin-top: 64px; font-size: 150px; }
  .og .redbox__tag { font-size: 15px; }
  .og-role { margin-top: 22px; font-size: 30px; font-weight: 500; }
  .og-stats { position: absolute; left: 64px; bottom: 54px; display: flex; gap: 44px; }
  .og-stats b { display: block; font-family: var(--stencil); font-weight: 800; font-size: 54px; line-height: 0.95; }
  .og-stats p:nth-child(3) b { color: var(--red); }
  .og-stats span { font-size: 17px; color: var(--text-2); }
  .og-url { position: absolute; right: 64px; bottom: 58px; font-family: var(--mono); font-size: 17px; color: var(--text-2); background: rgba(var(--bg-rgb), 0.8); padding: 6px 10px; }
</style>
</head>
<body>
  <div class="og">
    <div class="hero__wall"><div class="hero__plane" id="plane">
      <div class="hero__col"></div><div class="hero__col"></div><div class="hero__col"></div><div class="hero__col"></div><div class="hero__col"></div><div class="hero__col"></div>
    </div></div>
    <div class="og-shade"></div>
    <p class="hero__status"><span class="live-dot"></span>Open to security roles and pentest work</p>
    <h1 class="hero__title" style="margin-top:0">
      <span class="hero__name"><span class="hero__line">Parth Narula</span><span class="redbox"><i></i><i></i><i></i><i></i></span><span class="redbox__tag">On 250+ Halls of Fame</span></span>
    </h1>
    <p class="og-role">Security researcher and penetration tester</p>
    <div class="og-stats">
      <p><b>450+</b><span>organizations secured</span></p>
      <p><b>250+</b><span>Halls of Fame</span></p>
      <p><b>45</b><span>times the first researcher</span></p>
    </div>
    <p class="og-url">parthnarula.scriptjacker.in</p>
  </div>
  <script type="module">
    import { WALL } from "/assets/js/wall-data.js";
    const cols = document.querySelectorAll("#plane .hero__col");
    cols.forEach((col, c) => {
      col.style.animation = "none";
      col.innerHTML = WALL.filter((_, i) => i % 6 === c).map(([n, h]) => `<img src="/assets/img/wall/${n}.webp" width="240" height="${h}" alt="">`).join("");
    });
  </script>
</body>
</html>
